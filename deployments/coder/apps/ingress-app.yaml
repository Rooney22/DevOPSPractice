apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: coder-ingress
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Rooney22/DevOPSPractice.git
    targetRevision: HEAD
    path: deployments/coder/manifests-ingress
  destination:
    server: https://kubernetes.default.svc
    namespace: coder
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
