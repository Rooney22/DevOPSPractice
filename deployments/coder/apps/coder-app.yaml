apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: coder
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://helm.coder.com/v2
    chart: coder
    targetRevision: 2.18.5
    helm:
      values: |
        coder:
          env:
            - name: CODER_PG_CONNECTION_URL
              value: "postgres://coder:coder-pass@postgres.coder.svc.cluster.local:5432/coder?sslmode=disable"
            - name: CODER_ACCESS_URL
              value: "https://coder.cluster.k8s"
            - name: CODER_WILDCARD_ACCESS_URL
              value: "*.coder.cluster.k8s"
          service:
            type: ClusterIP
  destination:
    server: https://kubernetes.default.svc
    namespace: coder
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
